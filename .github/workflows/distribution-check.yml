name: Ethos Bitcoin Distribution Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-distribution:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Verify approved distribution
        run: python3 scripts/verify_integrity.py "Copy of Ethos_Bitcoin.xlsx"

      - name: Verify repository structure and policy files
        run: |
          test -f README.md
          test -f DONATIONS.md
          test -f DISTRIBUTION_TERMS.md
          test -f distribution_manifest.json
          test "$(find . -maxdepth 1 -type f -name 'Copy of Ethos_Bitcoin.xlsx' | wc -l)" -eq 1
          test "$(find . -maxdepth 1 -type f -name 'Ethos_Bitcoin*' | wc -l)" -eq 0
